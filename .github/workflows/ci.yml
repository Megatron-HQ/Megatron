name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node .githooks/pre-commit --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:package-security
      - run: npm run build
      - run: npx electron-builder --dir
      - if: runner.os == 'Windows'
        run: npm run verify:package -- dist/win-unpacked
      - if: runner.os == 'macOS'
        run: npm run verify:package -- dist
