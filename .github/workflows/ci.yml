name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:deps
      - run: node .githooks/pre-commit --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:package-security
      - run: npm run build
      - run: npx electron-builder --dir --publish never
      - if: runner.os == 'Windows'
        run: npm run verify:package -- dist/win-unpacked
      - if: runner.os == 'macOS'
        run: npm run verify:package -- dist
