name: Release

# Pushing a v* tag builds both platforms into a DRAFT GitHub Release. Nothing reaches users until
# someone reviews the draft and clicks Publish, which also triggers homebrew-tap.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the tag to match package.json
        run: node scripts/release-check.mjs tag "$GITHUB_REF_NAME"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skipped on a re-run, so retrying a failed platform reuses the same draft.
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "Megatron $GITHUB_REF_NAME"

  package:
    needs: draft
    environment: release
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            signing_certificate: MAC_CSC_LINK
            signing_password: MAC_CSC_KEY_PASSWORD
          - os: windows-latest
            platform: win
            signing_certificate: WINDOWS_CSC_LINK
            signing_password: WINDOWS_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    env:
      # One value drives both the build and the staple step. Unset or 'false' builds unsigned;
      # anything other than 'true'/'false' fails the build (scripts/release-build.mjs).
      MEGATRON_SIGNED_RELEASE: ${{ vars.MEGATRON_SIGNED_RELEASE }}
      CSC_LINK: ${{ secrets[matrix.signing_certificate] }}
      CSC_KEY_PASSWORD: ${{ secrets[matrix.signing_password] }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MEGATRON_WINDOWS_PUBLISHER: ${{ vars.MEGATRON_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:deps
      - run: node .githooks/pre-commit --check
      - run: npm run lint
      - run: npm test
      - run: npm run test:package-security
      - run: npm run build
      # Validates signing credentials first when the switch is on, then packages and verifies.
      - run: node scripts/release-build.mjs ${{ matrix.platform }}
      - name: Staple and validate the DMG
        if: runner.os == 'macOS' && env.MEGATRON_SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          $images = Get-ChildItem -LiteralPath dist -Filter '*.dmg'
          if ($images.Count -eq 0) { throw 'Notarized DMG is missing' }
          foreach ($image in $images) {
            & /usr/bin/xcrun notarytool submit $image.FullName --apple-id $env:APPLE_ID --password $env:APPLE_APP_SPECIFIC_PASSWORD --team-id $env:APPLE_TEAM_ID --wait
            if ($LASTEXITCODE -ne 0) { throw 'DMG notarization failed' }
            & /usr/bin/codesign --verify --strict $image.FullName
            if ($LASTEXITCODE -ne 0) { throw 'DMG signature verification failed' }
            & /usr/bin/xcrun stapler staple $image.FullName
            if ($LASTEXITCODE -ne 0) { throw 'DMG stapling failed' }
            & /usr/bin/xcrun stapler validate $image.FullName
            if ($LASTEXITCODE -ne 0) { throw 'DMG staple validation failed' }
          }
      # After stapling, so a signed DMG is uploaded in its final form. latest*.yml is the update
      # feed electron-updater reads; the blockmaps enable differential downloads on Windows.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo 'No release artifacts in dist/'; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
