appId: com.megatron.app
productName: Megatron
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
mac:
  # Icon Composer file: electron-builder compiles it with Xcode 26+'s actool into Assets.car
  # (macOS 26+) plus a generated .icns fallback for older macOS and the DMG.
  icon: build/icon.icon
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Megatron needs access to project folders you grant, to discover project-level skills.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
