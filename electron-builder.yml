appId: com.megatron.app
productName: Megatron
publish: null
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon.ico
  - resources/icon.png
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
mac:
  # Icon Composer file: electron-builder compiles it with Xcode 26+'s actool into Assets.car
  # (macOS 26+) plus a generated .icns fallback for older macOS and the DMG.
  icon: build/icon.icon
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Megatron needs access to project folders you grant, to discover project-level skills.
  notarize: true
win:
  target: nsis
  icon: build/icon.ico
nsis:
  packElevateHelper: false
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
dmg:
  sign: true
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
